<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>
    <link rel="stylesheet" th:href="@{/css/usuarios.css}">
</head>

<body>
<nav>
    <a th:href="@{/index}" class="nav-logo">Evoluciona</a>
    <ul class="nav-links">
        <li><a th:href="@{/index}">Inicio</a></li>
    </ul>
</nav>

<div class="usuario-container">

    <!-- ENCABEZADO -->
    <div class="page-header" style="padding: 0 0 2.5rem;">
        <div>
            <p class="page-tag">Administración</p>
            <h1 class="page-title">Gestión de <em>Usuarios</em></h1>
        </div>
    </div>

    <!-- STATS -->
    <div class="stats-pills">
        <div class="stat-pill">
            <div class="stat-pill-icon pill-verde">👤</div>
            <div>
                <div class="stat-pill-label">Total usuarios</div>
                <div class="stat-pill-num"
                     th:text="${#lists.size(usuarios)}">0</div>
            </div>
        </div>
        <div class="stat-pill">
            <div class="stat-pill-icon pill-cafe">✅</div>
            <div>
                <div class="stat-pill-label">Activos</div>
                <div class="stat-pill-num"
                     th:text="${#lists.size(usuarios)}">0</div>
            </div>
        </div>
        <div class="stat-pill">
            <div class="stat-pill-icon pill-crema">⏳</div>
            <div>
                <div class="stat-pill-label">Pendientes</div>
                <div class="stat-pill-num">0</div>
            </div>
        </div>
    </div>

    <!-- TOOLBAR -->
    <div class="toolbar">
        <div class="search-wrap">
            <span class="search-icon">🔍</span>
            <input type="text"
                   id="buscar"
                   class="search-input"
                   placeholder="Buscar usuario..."
                   onkeyup="filtrarTabla()">
        </div>
        <button class="btn-primary"
                onclick="window.location.href='/usuarios'">
            ＋ Nuevo usuario
        </button>
    </div>

    <!-- TABLA -->
    <div class="table-wrap">
        <table class="usuario-table" id="tablaUsuarios">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Contraseña</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>

            <tr th:each="u : ${usuarios}">
                <td>
                    <span class="id-badge"
                          th:text="'#' + ${u.id_usuario}">
                    </span>
                </td>
                <td>
                    <div class="td-nombre">
                        <div class="usuario-avatar"
                             th:text="${#strings.toUpperCase(
                               #strings.substring(u.nombre_completo, 0, 2))}">
                        </div>
                        <span th:text="${u.nombre_completo}"></span>
                    </div>
                </td>
                <td>
                    <span class="correo-text"
                          th:text="${u.correoUsuario}">
                    </span>
                </td>
                <td>
                    <span class="pass-badge">••••••••</span>
                </td>
                <td>
                    <div class="td-actions-inner">
                        <a class="btn-icon btn-edit"
                           th:href="@{/usuarios/editar/{id}(id=${u.id_usuario})}"
                           title="Editar">✏️</a>
                        <a class="btn-icon btn-delete"
                           th:href="@{/usuarios/eliminar/{id}(id=${u.id_usuario})}"
                           onclick="return confirm('¿Eliminar usuario?')"
                           title="Eliminar">🗑️</a>
                    </div>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(usuarios)}" class="empty-row">
                <td colspan="5">
                    <div class="empty-state">
                        <div class="empty-icon">👥</div>
                        <p class="empty-text">No hay usuarios registrados</p>
                    </div>
                </td>
            </tr>

            </tbody>
        </table>
    </div>

    <!-- FORMULARIO -->
    <div class="form-section-wrap">
        <div class="form-section">

            <div class="form-section-header">
                <h2 class="form-section-title">
                    <span th:if="${usuario.id_usuario != null}">
                        Editar <em>usuario</em>
                    </span>
                    <span th:if="${usuario.id_usuario == null}">
                        Nuevo <em>usuario</em>
                    </span>
                </h2>
                <p class="form-section-sub">
                    Completa los campos para registrar o actualizar
                    un usuario en el sistema.
                </p>
            </div>

            <form th:action="@{/usuarios/guardar}"
                  th:object="${usuario}"
                  method="post">

                <input type="hidden" th:field="*{id_usuario}">

                <div class="form-group">
                    <label class="form-label">Nombre completo</label>
                    <input type="text"
                           class="form-input"
                           th:field="*{nombre_completo}"
                           placeholder="Ej. María González"
                           required>
                </div>

                <div class="form-group">
                    <label class="form-label">Correo electrónico</label>
                    <input type="email"
                           class="form-input"
                           th:field="*{correoUsuario}"
                           placeholder="usuario@correo.com"
                           required>
                </div>

                <div class="form-group">
                    <label class="form-label">Contraseña</label>
                    <input type="password"
                           class="form-input"
                           th:field="*{contraseña}"
                           placeholder="••••••••"
                           required>
                </div>

                <div class="form-actions">
                    <button type="button"
                            class="btn-secondary"
                            onclick="window.location.href='/usuarios'">
                        Cancelar
                    </button>
                    <button type="submit" class="btn-primary">
                        <span th:text="${usuario.id_usuario != null}
                              ? 'Actualizar' : 'Guardar'">
                        </span>
                    </button>
                </div>

            </form>
        </div>
    </div>

</div>

<script th:src="@{/js/buscadorUsuario.js}"></script>

</body>
</html>
